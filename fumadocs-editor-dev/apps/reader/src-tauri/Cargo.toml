[package]
name = "bookgraph-desktop"
version = "0.1.0"
description = "Local-first BookGraph reader"
authors = ["BookGraph"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
keyring = "3"
